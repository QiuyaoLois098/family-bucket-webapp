<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Frost Reveal Host</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0c1028;
  }
  main, .viewer, .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  /* Designer handoff: img under canvas; canvas fades in only when WebGL has the photo. */
  .photo img,
  .photo canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .photo canvas {
    opacity: 0;
    transition: opacity 0.35s;
    z-index: 1;
  }
  .photo.ready canvas {
    opacity: 1;
  }
  #fallback {
    z-index: 0;
    opacity: 0;
    pointer-events: none;
  }
  #loading, #error, .transport, .question-panel, aside, header, nav, footer, .controls {
    display: none !important;
  }
</style>
</head>
<body data-clear-text="true">
  <main>
    <section class="viewer">
      <div class="photo" id="photo">
        <img id="fallback" alt="" />
        <canvas id="scene" aria-label="Soft frost photo animation"></canvas>
        <div id="loading">Preparing…</div>
      </div>
      <div class="transport">
        <button id="play" type="button">Ⅱ</button>
        <progress id="progress" max="1" value="0"></progress>
        <span id="percent">0%</span>
        <button id="replay" type="button">↺</button>
        <button class="expand" id="fullscreen" type="button">⤢</button>
      </div>
      <div class="question-panel">
        <div class="steps">
          <span data-step="1">Q1</span>
          <span data-step="2">Q2</span>
          <span data-step="3">Q3</span>
        </div>
        <p id="stageStatus" role="status"></p>
        <button id="answer" type="button" disabled>Answer</button>
      </div>
    </section>
    <aside class="controls">
      <button id="reset" type="button">Reset</button>
      <input id="transitionDuration" type="range" min="1" max="8" step="0.5" value="3" />
      <output id="transitionDurationOut"></output>
      <input id="exitDuration" type="range" min="2" max="12" step="0.5" value="6" />
      <output id="exitDurationOut"></output>
      <input id="photoSpeed" type="range" min="0" max="2" step="0.05" value="1" />
      <output id="photoSpeedOut"></output>
      <input id="photoBrightness" type="range" min="0.5" max="1.75" step="0.01" value="1" />
      <output id="photoBrightnessOut"></output>
      <input id="globalDim" type="checkbox" />
      <input id="blur" type="range" min="0" max="1" step="0.01" value="1" />
      <output id="blurOut"></output>
      <input id="photoCore" type="range" min="0.25" max="3" step="0.05" value="1.5" />
      <output id="photoCoreOut"></output>
      <input id="soft" type="range" min="0" max="1" step="0.01" value="0.98" />
      <output id="softOut"></output>
      <input id="color" type="range" min="0" max="1" step="0.01" value="0" />
      <output id="colorOut"></output>
      <input id="light" type="range" min="0" max="1" step="0.01" value="0" />
      <output id="lightOut"></output>
      <input id="radius" type="range" min="40" max="200" step="1" value="200" />
      <output id="radiusOut"></output>
      <input id="radius1" type="range" min="0" max="200" step="1" value="160" />
      <output id="radius1Out"></output>
      <input id="radius2" type="range" min="0" max="200" step="1" value="132" />
      <output id="radius2Out"></output>
      <output id="radiusCurrentOut"></output>
      <input id="zoom" type="range" min="1" max="8" step="0.1" value="4" />
      <output id="zoomOut"></output>
      <input id="focusX" type="range" min="0" max="1" step="0.01" value="0.5" />
      <output id="focusXOut"></output>
      <input id="focusY" type="range" min="0" max="1" step="0.01" value="0.5" />
      <output id="focusYOut"></output>
      <button id="startFrame" type="button">Preview</button>
      <input id="textEffect" type="checkbox" />
      <input id="textStrength" type="range" min="0" max="1" step="0.01" value="1" />
      <output id="textStrengthOut"></output>
      <input id="textCore" type="range" min="0.25" max="3" step="0.05" value="1.5" />
      <output id="textCoreOut"></output>
      <input id="textRadius" type="range" min="0.08" max="1.4" step="0.01" value="0.29" />
      <output id="textRadiusOut"></output>
      <input id="textSpeed" type="range" min="0" max="2" step="0.05" value="2" />
      <output id="textSpeedOut"></output>
      <input id="textPeriod" type="hidden" value="5.5" />
      <input id="upload" type="file" accept="image/*" />
      <p id="error" role="alert"></p>
      <button class="preset active" data-mode="0" aria-pressed="true" type="button">Soft frost</button>
      <button class="preset" data-mode="1" aria-pressed="false" type="button">Color bloom</button>
    </aside>
  </main>
  <script src="./interaction.js"></script>
  <script src="./shared-scene.js"></script>
  <script src="./app.js"></script>
  <script src="./host-bridge.js"></script>
</body>
</html>
